name: 200 production candidate CI

on:
  push:
    branches: [ main ]
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/candidate-hashes.js"
      - "hardhat.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-candidate-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/candidate-hashes.js"
      - "hardhat.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-candidate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run candidate:hashes
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-reproducibility
          path: |
            package-lock.json
            artifacts/contracts/TwoHundredToken.sol/TwoHundredToken.json
          if-no-files-found: error
          retention-days: 14
