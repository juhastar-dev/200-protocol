<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>200 transferFrom Test v2</title>
<style>
body{margin:0;background:#06100c;color:#eaf7ef;font-family:system-ui,sans-serif;line-height:1.5}main{max-width:820px;margin:auto;padding:32px 20px}
.card{background:#0d1d16;border:1px solid #1e3e2d;border-radius:18px;padding:22px;margin:18px 0}
button{background:#76f3a5;color:#06100c;border:0;border-radius:12px;padding:15px 20px;font-weight:800;font-size:16px;cursor:pointer;margin:5px}.secondary{background:#183426;color:#eaf7ef;border:1px solid #31513e}.mono{font-family:monospace;word-break:break-all;color:#c8edd3}.ok{color:#76f3a5;font-weight:800}.bad{color:#ff7373;font-weight:800}a{color:#76f3a5}
</style></head>
<body><main>
<p><a href="index.html">← 200 Protocol</a></p>
<h1>200 transferFrom Test v2</h1>
<p>This fresh page first checks which MetaMask account the website actually receives. No transfer is performed yet.</p>
<div class="card">
<h2>Step 1 — Connect Account 2</h2>
<p>Required wallet: <span class="mono">0x64d6719831414f883aA51CB59584D7B4F4066E08</span></p>
<button id="connect">Connect MetaMask</button>
<button id="choose" class="secondary">Choose Account 2</button>
<button id="switch" class="secondary">Switch to Base Sepolia</button>
<p id="status">Ready.</p>
<p id="wallet" class="mono">Website sees: —</p>
<p id="chain" class="mono">Chain: —</p>
</div>
<script>
const WANT='0x64d6719831414f883aa51cb59584d7b4f4066e08';
const statusEl=document.getElementById('status');
const walletEl=document.getElementById('wallet');
const chainEl=document.getElementById('chain');
function clean(e){return String(e&&e.message?e.message:e).replace(/[<>]/g,'')}
async function refresh(){
 if(!window.ethereum){statusEl.innerHTML='<span class="bad">MetaMask not detected.</span>';return;}
 try{
  const a=await window.ethereum.request({method:'eth_accounts'});
  const ch=await window.ethereum.request({method:'eth_chainId'});
  const acct=(a[0]||'');
  walletEl.textContent='Website sees: '+(acct||'not connected');
  chainEl.textContent='Chain: '+parseInt(ch,16)+' ('+ch+')';
  if(acct && acct.toLowerCase()===WANT && ch.toLowerCase()==='0x14a34'){
    statusEl.innerHTML='<span class="ok">PASS — Account 2 and Base Sepolia are correctly connected.</span>';
  }else if(acct){
    statusEl.innerHTML='<span class="bad">Website still sees the wrong account. It currently sees '+acct+'.</span>';
  }
 }catch(e){statusEl.innerHTML='<span class="bad">'+clean(e)+'</span>'}
}
document.getElementById('connect').onclick=async()=>{try{await window.ethereum.request({method:'eth_requestAccounts'});await refresh()}catch(e){statusEl.innerHTML='<span class="bad">'+clean(e)+'</span>'}};
document.getElementById('choose').onclick=async()=>{try{await window.ethereum.request({method:'wallet_requestPermissions',params:[{eth_accounts:{}}]});await refresh()}catch(e){statusEl.innerHTML='<span class="bad">'+clean(e)+'</span>'}};
document.getElementById('switch').onclick=async()=>{try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x14a34'}]});await refresh()}catch(e){statusEl.innerHTML='<span class="bad">'+clean(e)+'</span>'}};
if(window.ethereum){window.ethereum.on?.('accountsChanged',refresh);window.ethereum.on?.('chainChanged',refresh)}
refresh();
</script>
</main></body></html>
